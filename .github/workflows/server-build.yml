name: Server Build

# The headless Splitkick server (src-server, binary `splitkick-server`).
#
# The server has its own pre-release track (1.0.0-pre.N, version in
# src-server/Cargo.toml), apart from the desktop app. Desktop releases do not
# run this workflow. Run it by hand (workflow_dispatch) on the commit to
# release:
# - with `version`: build, test, then create the GitHub pre-release
#   `splitkick-server-v<version>` (never marked latest: the desktop updater
#   reads releases/latest) with the Linux tarballs, their .sha256 files and
#   server-latest.json, and push ghcr.io/<owner>/splitkick-server:<version>
#   (no :latest);
# - without `version`: only build and test.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Server pre-release to publish (for example 1.0.0-pre.1; must match src-server/Cargo.toml). Empty = build and test only'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/splitkick-server

jobs:
  metadata:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve server version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The version the binary reports (CARGO_PKG_VERSION).
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-server/Cargo.toml | head -n1)
          [ -n "$VERSION" ] || { echo "::error::No version in src-server/Cargo.toml"; exit 1; }
          # Own tag prefix: splitkick-v<version> is the desktop app's.
          TAG="splitkick-server-v$VERSION"
          if [ -n "$INPUT_VERSION" ]; then
            if [ "$INPUT_VERSION" != "$VERSION" ]; then
              echo "::error::Input $INPUT_VERSION does not match src-server/Cargo.toml version $VERSION"
              exit 1
            fi
            case "$VERSION" in
              *-pre.*) ;;
              *) echo "::error::Only pre-releases (x.y.z-pre.N) are set up for the server; $VERSION is not one"; exit 1 ;;
            esac
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $TAG already exists"
              exit 1
            fi
            grep -q "^## \[$VERSION\]" src-server/CHANGELOG.md || {
              echo "::error::src-server/CHANGELOG.md has no ## [$VERSION] section"
              exit 1
            }
            PUBLISH=true
          else
            TAG="manual-${GITHUB_SHA::7}"
            PUBLISH=false
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Building Splitkick server $VERSION for $TAG (publish: $PUBLISH)"

  build-binaries:
    name: Build server binary (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            asset: splitkick-server-linux-amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
            asset: splitkick-server-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./jean-core -> target
            ./src-server -> target
          shared-key: server-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend bundle
        run: bun run build

      - name: Build splitkick-server
        run: cd src-server && cargo build --release --locked

      - name: Verify Tauri-free headless runtime and version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          # `! cmd` would not stop the job (it skips errexit), so test explicitly.
          if cargo tree --manifest-path src-server/Cargo.toml -p splitkick-server | grep -Ei 'tauri|wry|webkit|gtk'; then
            echo "::error::splitkick-server depends on Tauri/WebView crates"; exit 1
          fi
          if ldd src-server/target/release/splitkick-server | grep -Ei 'webkit|gtk|appindicator'; then
            echo "::error::splitkick-server links WebView/GTK libraries"; exit 1
          fi
          reported=$(src-server/target/release/splitkick-server --version)
          echo "$reported"
          [ "$reported" = "Splitkick $VERSION" ]
          env -u DISPLAY -u WAYLAND_DISPLAY SPLITKICK_DATA_DIR="$RUNNER_TEMP/splitkick-data" \
            src-server/target/release/splitkick-server --host 127.0.0.1 --port 3461 --no-token &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3461/readyz && break
            sleep 1
          done
          curl --fail http://127.0.0.1:3461/readyz
          # /api/auth reports the server release next to the app version.
          auth=$(curl --fail --silent http://127.0.0.1:3461/api/auth)
          echo "$auth"
          echo "$auth" | grep -q "\"serverVersion\":\"$VERSION\""

      - name: Package binary
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p artifacts
          cp src-server/target/release/splitkick-server "artifacts/${ASSET}"
          tar -C artifacts -czf "artifacts/${ASSET}-${VERSION}.tar.gz" "${ASSET}"
          (cd artifacts && shasum -a 256 "${ASSET}-${VERSION}.tar.gz" > "${ASSET}-${VERSION}.tar.gz.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitkick-server-linux-${{ matrix.arch }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256

  publish-release:
    name: Create the GitHub pre-release
    needs: [metadata, build-binaries]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # gh release needs repo context, and the notes come from the changelog.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: splitkick-server-linux-amd64
          path: artifacts/amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: splitkick-server-linux-arm64
          path: artifacts/arm64

      - name: Build server-latest.json and create the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          amd64_sha=$(awk '{print $1}' "artifacts/amd64/splitkick-server-linux-amd64-${VERSION}.tar.gz.sha256")
          arm64_sha=$(awk '{print $1}' "artifacts/arm64/splitkick-server-linux-arm64-${VERSION}.tar.gz.sha256")
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PUB_DATE="$pub_date" AMD64_SHA="$amd64_sha" ARM64_SHA="$arm64_sha" \
          VERSION="$VERSION" RELEASE_TAG="$RELEASE_TAG" REPO="$REPO" python3 <<'PY'
          import json, os

          version = os.environ["VERSION"]
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPO"]
          manifest = {
              "version": version,
              "pubDate": os.environ["PUB_DATE"],
              "platforms": {
                  "linux-amd64": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/splitkick-server-linux-amd64-{version}.tar.gz",
                      "sha256": os.environ["AMD64_SHA"],
                  },
                  "linux-arm64": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/splitkick-server-linux-arm64-{version}.tar.gz",
                      "sha256": os.environ["ARM64_SHA"],
                  },
              },
          }
          with open("server-latest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, separators=(",", ":"), sort_keys=True)
          print(json.dumps(manifest, indent=2))
          PY

          # The ## [VERSION] section of the server changelog, heading excluded.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' src-server/CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::Empty changelog section for $VERSION"; exit 1; }

          # A pre-release, never "latest": the desktop updater reads
          # releases/latest/download/latest.json.
          gh release create "$RELEASE_TAG" \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Splitkick server $VERSION" \
            --notes-file notes.md \
            --prerelease \
            --latest=false \
            artifacts/amd64/*.tar.gz artifacts/amd64/*.sha256 \
            artifacts/arm64/*.tar.gz artifacts/arm64/*.sha256 \
            server-latest.json

  docker-image:
    name: Build Docker image (${{ matrix.arch }})
    needs: [metadata, build-binaries, publish-release]
    # Also on a build-only run, where publish-release is skipped. A failed
    # release pushes no image.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: splitkick-server-linux-${{ matrix.arch }}
          path: artifacts

      - name: Prepare Docker context
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p docker-context
          tar -xzf "artifacts/splitkick-server-linux-${ARCH}-${VERSION}.tar.gz" -C docker-context
          mv "docker-context/splitkick-server-linux-${ARCH}" docker-context/splitkick-server
          chmod +x docker-context/splitkick-server
          cp scripts/docker-entrypoint.sh docker-context/docker-entrypoint.sh
          cp Dockerfile.server-runtime docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.metadata.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}-${{ matrix.arch }}

      # Only a release pushes. A build-only run still proves the image builds.
      - name: Build (and push) architecture image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ needs.metadata.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-manifest:
    name: Publish multi-arch Docker manifest
    needs: [metadata, docker-image]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          # Only :<version>. A pre-release never moves :latest.
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
