name: Server Build

# The headless Splitkick server (src-server, binary `splitkick-server`).
#
# Desktop releases do not run this any more: the server has its own
# pre-release track (1.0.0-pre.N) until it is tested. Run it by hand
# (workflow_dispatch). With a tag it adds the Linux server tarballs,
# server-latest.json and the Docker image ghcr.io/<owner>/splitkick-server to
# that release; without a tag it only builds and tests.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to add the server to (splitkick-v<version>)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to add the server to (for example splitkick-v1.5.16). Empty = build and test only'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/splitkick-server

jobs:
  metadata:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The version the binary reports (build.rs reads the same file).
          VERSION=$(node -p "require('./src-tauri/tauri.fork.conf.json').version")
          if [ -n "$RELEASE_TAG" ]; then
            if [ "$RELEASE_TAG" != "splitkick-v$VERSION" ]; then
              echo "::error::Tag $RELEASE_TAG does not match tauri.fork.conf.json version $VERSION"
              exit 1
            fi
            PUBLISH=true
          else
            RELEASE_TAG="manual-${GITHUB_SHA::7}"
            PUBLISH=false
          fi
          case "$VERSION" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Building Splitkick server $VERSION for $RELEASE_TAG (publish: $PUBLISH)"

  build-binaries:
    name: Build server binary (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            asset: splitkick-server-linux-amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
            asset: splitkick-server-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./jean-core -> target
            ./src-server -> target
          shared-key: server-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend bundle
        run: bun run build

      - name: Build splitkick-server
        run: cd src-server && cargo build --release --locked

      - name: Verify Tauri-free headless runtime and version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          ! cargo tree --manifest-path src-server/Cargo.toml -p splitkick-server | grep -Ei 'tauri|wry|webkit|gtk'
          ! ldd src-server/target/release/splitkick-server | grep -Ei 'webkit|gtk|appindicator'
          reported=$(src-server/target/release/splitkick-server --version)
          echo "$reported"
          [ "$reported" = "Splitkick $VERSION" ]
          env -u DISPLAY -u WAYLAND_DISPLAY SPLITKICK_DATA_DIR="$RUNNER_TEMP/splitkick-data" \
            src-server/target/release/splitkick-server --host 127.0.0.1 --port 3461 --no-token &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3461/readyz && break
            sleep 1
          done
          curl --fail http://127.0.0.1:3461/readyz

      - name: Package binary
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p artifacts
          cp src-server/target/release/splitkick-server "artifacts/${ASSET}"
          tar -C artifacts -czf "artifacts/${ASSET}-${VERSION}.tar.gz" "${ASSET}"
          (cd artifacts && shasum -a 256 "${ASSET}-${VERSION}.tar.gz" > "${ASSET}-${VERSION}.tar.gz.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitkick-server-linux-${{ matrix.arch }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256

      - name: Upload release assets
        if: needs.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/*.tar.gz artifacts/*.sha256 --clobber

  publish-update-manifest:
    name: Publish server-latest.json
    needs: [metadata, build-binaries]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # gh release upload needs repo context; without checkout it fails with
      # "fatal: not a git repository" even when GH_TOKEN is set.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: splitkick-server-linux-amd64
          path: artifacts/amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: splitkick-server-linux-arm64
          path: artifacts/arm64

      - name: Build and upload server-latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          amd64_sha=$(awk '{print $1}' artifacts/amd64/splitkick-server-linux-amd64-${VERSION}.tar.gz.sha256)
          arm64_sha=$(awk '{print $1}' artifacts/arm64/splitkick-server-linux-arm64-${VERSION}.tar.gz.sha256)
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PUB_DATE="$pub_date" AMD64_SHA="$amd64_sha" ARM64_SHA="$arm64_sha" \
          VERSION="$VERSION" RELEASE_TAG="$RELEASE_TAG" REPO="$REPO" python3 <<'PY'
          import json, os

          version = os.environ["VERSION"]
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPO"]
          manifest = {
              "version": version,
              "pubDate": os.environ["PUB_DATE"],
              "platforms": {
                  "linux-amd64": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/splitkick-server-linux-amd64-{version}.tar.gz",
                      "sha256": os.environ["AMD64_SHA"],
                  },
                  "linux-arm64": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/splitkick-server-linux-arm64-{version}.tar.gz",
                      "sha256": os.environ["ARM64_SHA"],
                  },
              },
          }
          with open("server-latest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, separators=(",", ":"), sort_keys=True)
          print(json.dumps(manifest, indent=2))
          PY

          gh release upload "$RELEASE_TAG" server-latest.json --clobber

  docker-image:
    name: Build Docker image (${{ matrix.arch }})
    needs: [metadata, build-binaries]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: splitkick-server-linux-${{ matrix.arch }}
          path: artifacts

      - name: Prepare Docker context
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p docker-context
          tar -xzf "artifacts/splitkick-server-linux-${ARCH}-${VERSION}.tar.gz" -C docker-context
          mv "docker-context/splitkick-server-linux-${ARCH}" docker-context/splitkick-server
          chmod +x docker-context/splitkick-server
          cp scripts/docker-entrypoint.sh docker-context/docker-entrypoint.sh
          cp Dockerfile.server-runtime docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.metadata.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}-${{ matrix.arch }}

      # Only a release pushes. A build-only run still proves the image builds.
      - name: Build (and push) architecture image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ needs.metadata.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-manifest:
    name: Publish multi-arch Docker manifest
    needs: [metadata, docker-image]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail

          create_manifest() {
            docker buildx imagetools create \
              -t "${IMAGE}:$1" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
          }

          create_manifest "$VERSION"
          # A pre-release never moves `latest`, as on the release page.
          if [ "$PRERELEASE" != "true" ]; then
            create_manifest "latest"
          fi
