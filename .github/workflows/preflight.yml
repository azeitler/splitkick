name: Preflight

on:
  workflow_call:
    inputs:
      version:
        description: 'Optional release version to assert, with or without v prefix (e.g., v1.0.0)'
        required: false
        type: string
        default: ''
      publishFlavor:
        description: 'Build and sign the Splitkick bundle (and publish it when the version is new) instead of discarding the compiled binary'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The constant names keep the "latest release" download URLs stable, even
  # though every release has its own tag. The versioned DMG is uploaded too.
  DMG_NAME: Splitkick-aarch64.dmg
  UPDATER_NAME: Splitkick-aarch64.app.tar.gz
  WIN_SETUP_NAME: Splitkick-x64-setup.exe

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      # Needed by the "Publish rolling release" step. GitHub does not allow
      # expressions here, so it is granted unconditionally; the step itself only
      # runs when publishFlavor is set.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # macOS is the platform this fork ships. Windows runs the same checks and
        # builds an unsigned installer artifact, but publishes nothing yet
        # (issue #71). Restore an
        # entry to bring a platform back; every step below is still
        # platform-aware.
        #   - platform: 'ubuntu-22.04'
        #     preflightArgs: ''
        #   - platform: 'ubuntu-22.04-arm'
        #     preflightArgs: ''
        include:
          - platform: 'macos-latest'
            preflightArgs: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            preflightArgs: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assert release version
        if: inputs.version != ''
        run: node scripts/assert-release-version.js "${{ inputs.version }}"

      # The Splitkick version is set in src-tauri/tauri.fork.conf.json by
      # `bun run release:cut`. A push publishes it only when it has a
      # CHANGELOG.md section and no splitkick-v<version> tag yet.
      - name: Resolve the Splitkick version
        id: version
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        # An explicit bash sets pipefail, which the default shell does not, so a
        # failing resolver fails the step instead of being swallowed by tee.
        shell: bash
        run: node scripts/splitkick-version.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: preflight-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Tauri build script requires bundle.resources path `../dist` to exist
      # (see tauri.conf.json). Keep this even if dist/.gitkeep is missing.
      # Use bash so Windows runners don't use PowerShell mkdir (fails if dist exists).
      - name: Ensure dist exists for Tauri resources
        shell: bash
        run: mkdir -p dist && touch dist/.gitkeep

      - name: Rust clippy
        run: bun run rust:clippy

      - name: Frontend tests
        run: bun run test:run

      - name: Release version tests
        run: bun run test:splitkick-version

      - name: Release notes tests
        run: bun run test:changelog-notes && bun run test:release-cut && bun run test:updater-manifest

      - name: Web branding tests
        run: bun run test:web-branding

      - name: Web service worker tests
        run: bun run test:web-service-worker

      - name: Branding check
        run: bun run check:branding

      - name: Rust tests
        run: bun run rust:test

      # Platforms without a bundle step below compile here and throw the
      # binary away.
      - name: Build Tauri app without bundling
        if: ${{ matrix.platform != 'windows-latest' && (!inputs.publishFlavor || matrix.platform != 'macos-latest') }}
        run: bun run tauri build ${{ matrix.preflightArgs }} --no-bundle --ci

      # Windows: the same compile, bundled as an NSIS installer with the
      # Splitkick overlay. It is not code-signed yet (issue #71): SmartScreen
      # warns on the first start. The update signature works like on macOS.
      - name: Build Windows installer
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.SPLITKICK_UPDATER_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.SPLITKICK_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          # Same rules as the macOS bundle step below: only a complete key
          # pair turns the updater artifacts on.
          complete() { [ "${#1}" -ge 4 ]; }
          UPDATER_CONFIG='{}'
          if complete "$UPDATER_KEY" && complete "$UPDATER_KEY_PASSWORD"; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_KEY_PASSWORD"
            UPDATER_CONFIG='{"bundle": {"createUpdaterArtifacts": true}}'
            echo "Building updater artifacts"
          else
            echo "No updater key - this build ships no in-app update"
          fi
          bun run tauri build --ci --bundles nsis \
            -c src-tauri/tauri.fork.conf.json \
            -c "$UPDATER_CONFIG"

      # The installer under its stable and its versioned name, plus the update
      # signature when there is one, for the publish job.
      - name: Collect the Windows installer
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          SETUP=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' -print -quit)
          if [ -z "$SETUP" ]; then
            echo "No installer was produced"
            exit 1
          fi
          VERSION=$(node -p "require('./src-tauri/tauri.fork.conf.json').version")
          mkdir -p release
          cp "$SETUP" "release/$WIN_SETUP_NAME"
          cp "$SETUP" "release/Splitkick-$VERSION-x64-setup.exe"
          if [ -f "$SETUP.sig" ]; then
            cp "$SETUP.sig" "release/$WIN_SETUP_NAME.sig"
          fi
          ls -l release

      - name: Upload Windows installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: splitkick-windows-x64-${{ github.sha }}
          path: release/${{ env.WIN_SETUP_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Windows release files
        if: ${{ inputs.publishFlavor && matrix.platform == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/
          if-no-files-found: error
          retention-days: 1

      # Fork flavor. This is the same compile as the step above, so the two are
      # mutually exclusive: the binary is bundled, signed and published instead
      # of being thrown away. See docs/developer/fork-macos-builds.md.
      - name: Build Splitkick bundle
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER_KEY: ${{ secrets.SPLITKICK_UPDATER_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.SPLITKICK_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          # A missing secret arrives as an empty string, and Tauri reads
          # APPLE_SIGNING_IDENTITY with var_os. An empty value would therefore
          # be used as the identity and break codesign, so only a complete set
          # is exported. Everything else falls back to the ad-hoc identity in
          # the overlay. Four characters is below every real value.
          complete() { [ "${#1}" -ge 4 ]; }

          if complete "$IDENTITY" && complete "$CERT"; then
            # Overrides the coolLabs identity pinned in tauri.conf.json. The
            # bundler rejects APPLE_CERTIFICATE when it does not match.
            export APPLE_SIGNING_IDENTITY="$IDENTITY"
            export APPLE_CERTIFICATE="$CERT"
            export APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD"
            echo "Signing with the Developer ID certificate"

            if complete "$NOTARY_APPLE_ID" && complete "$NOTARY_PASSWORD" && complete "$TEAM_ID"; then
              export APPLE_ID="$NOTARY_APPLE_ID"
              export APPLE_PASSWORD="$NOTARY_PASSWORD"
              export APPLE_TEAM_ID="$TEAM_ID"
              export APPLE_PROVIDER_SHORT_NAME="$TEAM_ID"
              echo "Notarization is enabled"
            else
              echo "No notarization credentials - the build is signed but not notarized"
            fi
          else
            echo "No certificate - using the ad-hoc identity from the overlay"
          fi

          # The overlay leaves createUpdaterArtifacts off, because Tauri fails
          # the build when a pubkey is configured and the artifacts are asked
          # for without a private key - that would break every local build. It
          # is turned on here, and only when the key is actually present.
          # Both halves are required. Tauri prompts on a terminal that does not
          # exist when the password is missing, and rejects an empty one, so a
          # half-configured pair would fail the build rather than degrade.
          UPDATER_CONFIG='{}'
          if complete "$UPDATER_KEY" && complete "$UPDATER_KEY_PASSWORD"; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_KEY_PASSWORD"
            UPDATER_CONFIG='{"bundle": {"createUpdaterArtifacts": true}}'
            echo "Building updater artifacts"
          else
            echo "No updater key - this build ships no in-app update"
          fi

          # Configs are merged in the order they are given and the flag also
          # accepts an inline JSON string, so the updater switch is layered on
          # top of the overlay (which carries the version) without editing a
          # file. https://v2.tauri.app/reference/cli/#build
          bun run tauri build --ci ${{ matrix.preflightArgs }} \
            --bundles app,dmg \
            -c src-tauri/tauri.fork.conf.json \
            -c "$UPDATER_CONFIG"

      - name: Collect the DMG
        id: dmg
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -print -quit)
          if [ -z "$DMG" ]; then
            echo "No DMG was produced"
            exit 1
          fi
          mv "$DMG" "$DMG_NAME"
          APP="$BUNDLE_DIR/macos/Splitkick.app"
          codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/^Authority=/authority: /p' || true
          # Tauri notarizes the .app only; the DMG around it is signed but was
          # never sent to Apple, so Gatekeeper rejects the download itself
          # ("Unnotarized Developer ID"). Notarize and staple the DMG too.
          # A failure here fails the build: never publish a DMG Gatekeeper rejects.
          if xcrun stapler validate "$APP" > /dev/null 2>&1; then
            xcrun notarytool submit "$DMG_NAME" \
              --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$TEAM_ID" \
              --wait --timeout 30m
            xcrun stapler staple "$DMG_NAME"
            xcrun stapler validate "$DMG_NAME"
          fi
          cp "$DMG_NAME" "Splitkick-$VERSION-aarch64.dmg"
          # `spctl -a` accepts a Developer ID build that was never notarized as
          # long as the copy is not quarantined, so it cannot be used here. A
          # stapled ticket is the only definitive test.
          if xcrun stapler validate "$APP" > /dev/null 2>&1 && xcrun stapler validate "$DMG_NAME" > /dev/null 2>&1; then
            STATUS="notarized"
          elif codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            STATUS="signed, not notarized (Gatekeeper will warn)"
          else
            STATUS="ad-hoc (Gatekeeper will warn)"
          fi
          echo "Signature status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "$STATUS" > status-macos.txt

      # The in-app update check reads latest.json from the newest release,
      # downloads the package named in it, verifies it against the pubkey in
      # the overlay and replaces the app. The build step only produces the
      # package when the signing key exists, so a keyless build simply ships
      # no update. The publish job writes latest.json for all platforms.
      - name: Stage the updater package
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        run: |
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          TARBALL="$BUNDLE_DIR/macos/Splitkick.app.tar.gz"

          if [ ! -f "$TARBALL" ]; then
            echo "No updater artifacts in this build"
            exit 0
          fi
          mv "$TARBALL" "$UPDATER_NAME"
          mv "$TARBALL.sig" "$UPDATER_NAME.sig"

      - name: Upload build artifact
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: splitkick-macos-arm64-${{ steps.version.outputs.version }}
          path: ${{ env.DMG_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the macOS release files
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            ${{ env.DMG_NAME }}
            Splitkick-*-aarch64.dmg
            ${{ env.UPDATER_NAME }}
            ${{ env.UPDATER_NAME }}.sig
            status-macos.txt
          if-no-files-found: error
          retention-days: 1

  # One release for all platforms, once every build has finished. The macOS
  # build is required. A failed Windows build is reported and the release goes
  # out with macOS only, so a Windows problem never holds back the macOS update.
  publish:
    name: Publish
    needs: build
    if: ${{ !cancelled() && inputs.publishFlavor }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve the Splitkick version
        id: version
        shell: bash
        run: node scripts/splitkick-version.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Download the release files
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # Its own tag per release. A plain version is published --latest, which
      # keeps the /releases/latest/download/ URLs (installers and updater feed)
      # pointing at it. An -rc.N version is a GitHub pre-release: never
      # "latest", so the updater does not offer it.
      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd release
          ls -l
          if [ ! -f "$DMG_NAME" ]; then
            echo "::error::The macOS build is missing - nothing is published"
            exit 1
          fi

          ASSETS=("$DMG_NAME" "Splitkick-$VERSION-aarch64.dmg")
          MAC_STATUS=$(cat status-macos.txt 2>/dev/null || echo "unknown signature")
          WINDOWS="yes"
          if [ -f "$WIN_SETUP_NAME" ]; then
            ASSETS+=("$WIN_SETUP_NAME" "Splitkick-$VERSION-x64-setup.exe")
          else
            WINDOWS="no"
            echo "::warning::No Windows installer - this release ships macOS only"
          fi

          # latest.json has to sit in the newest release, because that is the
          # URL the installed app polls. It lists every platform whose update
          # package is signed; with none it is absent and the release only
          # carries the installers.
          node ../scripts/updater-manifest.mjs .
          UPDATE="no (this build has no updater artifacts)"
          if [ -f latest.json ]; then
            cat latest.json
            [ -f "$UPDATER_NAME" ] && ASSETS+=("$UPDATER_NAME")
            ASSETS+=(latest.json)
            UPDATE=$(node -p "Object.keys(require('./latest.json').platforms).join(', ')")
          fi

          # CHANGELOG.md is written per commit and says what changed and why,
          # so the release quotes its section for this version. A version with
          # no section falls back to the commit subjects since the last tag,
          # which is thin but still tells the reader what landed.
          CHANGES=$(node ../scripts/changelog-notes.mjs "$VERSION")
          if [ -z "$CHANGES" ] && [ -n "$PREVIOUS" ]; then
            echo "No CHANGELOG.md section for $VERSION - falling back to commit subjects"
            # Asked of the API, not of the clone: the checkout is shallow and
            # carries neither the previous tag nor the commits between.
            SUBJECTS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${GITHUB_SHA}" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' || true)
            if [ -n "$SUBJECTS" ]; then
              CHANGES=$(printf '### Commits\n\n%s' "$SUBJECTS")
            fi
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="_No change list was available for this build._"
          fi

          # The notes carry one line per change; the detail stays in
          # CHANGELOG.md, linked at this tag.
          LINKS="[Full changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)"
          if [ -n "$PREVIOUS" ]; then
            LINKS="$LINKS · [Compare with $PREVIOUS](https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG})"
          fi

          INSTALL="- **macOS** (Apple Silicon, $MAC_STATUS): open \`$DMG_NAME\` and drag Splitkick to Applications."
          if [ "$WINDOWS" = "yes" ]; then
            INSTALL="$INSTALL
          - **Windows** (x64, Windows 10 or 11): run \`$WIN_SETUP_NAME\`. The installer is not code-signed yet, so SmartScreen warns: choose **More info**, then **Run anyway**. Splitkick installs for the current user and needs no admin rights."
          fi

          # A heredoc keeps the markdown intact; --notes with an inline string
          # would have to escape every backtick and newline.
          cat > release-notes.md <<NOTES
          $CHANGES

          $LINKS

          ---

          Built on Jean $UPSTREAM · commit \`${GITHUB_SHA:0:7}\` · in-app update: $UPDATE

          $INSTALL

          Later versions arrive through the in-app update check. Splitkick installs next to Jean and has its own data folder.
          NOTES

          if [ "$PRERELEASE" = "true" ]; then
            CHANNEL=(--prerelease --latest=false)
          else
            CHANNEL=(--latest)
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            "${CHANNEL[@]}" \
            --title "Splitkick $VERSION" \
            --notes-file release-notes.md \
            "${ASSETS[@]}"

          {
            echo "### Splitkick $VERSION"
            echo ""
            echo "- built on: Jean $UPSTREAM"
            echo "- macOS: $MAC_STATUS"
            echo "- Windows: $WINDOWS"
            echo "- in-app update: $UPDATE"
            echo "- download: https://github.com/${REPOSITORY}/releases/latest/download/$DMG_NAME"
            if [ "$WINDOWS" = "yes" ]; then
              echo "- download: https://github.com/${REPOSITORY}/releases/latest/download/$WIN_SETUP_NAME"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # After a final release the website shows the new download facts and the
      # docs get its release notes: scripts/sync-sites.sh runs each repo's own
      # sync script and pushes the result to its main, so Vercel deploys both.
      # Deploy keys with write access, one per repo, are the two secrets below.
      - name: Update the website and the docs
        if: ${{ steps.version.outputs.publish == 'true' && steps.version.outputs.prerelease != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBSITE_DEPLOY_KEY: ${{ secrets.SPLITKICK_WEBSITE_DEPLOY_KEY }}
          DOCS_DEPLOY_KEY: ${{ secrets.SPLITKICK_DOCS_DEPLOY_KEY }}
        run: bash scripts/sync-sites.sh "$VERSION"
