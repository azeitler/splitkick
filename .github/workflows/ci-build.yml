name: CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    permissions:
      contents: write
    # publishFlavor turns the throwaway compile at the end of the gate into the
    # signed Splitkick bundle, and publishes it when the version is new. secrets: inherit passes the APPLE_*
    # secrets through to the reusable workflow.
    uses: ./.github/workflows/preflight.yml
    with:
      publishFlavor: true
    secrets: inherit

  # Adds the headless server (Linux tarballs, server-latest.json, Docker image)
  # to the release preflight just published. A release made with GITHUB_TOKEN
  # does not trigger `release:` workflows, so it is chained here.
  server:
    name: Server
    needs: preflight
    # !cancelled(): a failed Windows build fails preflight but still publishes.
    if: ${{ !cancelled() && needs.preflight.outputs.published == 'true' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/server-build.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
