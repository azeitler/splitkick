/* ===================== derived values (never stored) ===================== */
function servingSessions(id) { return SESSIONS.filter(s => s.serves.includes(id)); }
function isActive(id) { return servingSessions(id).some(s => s.status === 'running' || s.status === 'waiting' || s.status === 'review'); }
function openBlockers(n) {
  const out = [];
  for (const [k, t] of n.rel) {
    if (k === 'blocked-by' && !(t.includes('Windows') && M.answered.q2)) out.push(['blocked-by', t]);
    if (k === 'depends-on') { const d = byId(t); if (d && stateOf(d) !== 'done') out.push(['depends-on', t]); }
  }
  return out;
}
const children = id => NODES.filter(n => n.rel.some(([k, t]) => k === 'part-of' && t === id));
function progress(id) {
  const ch = children(id).filter(c => stateOf(c) !== 'dropped');
  return [ch.filter(c => stateOf(c) === 'done').length, ch.length];
}
function incoming(id, graphKey = 'roadmap') {
  const rev = { 'depends-on': 'needed by', 'blocked-by': 'blocks', 'part-of': 'has part', 'relates-to': 'related from' };
  const out = [];
  for (const n of NODES) for (const [k, t] of n.rel) if (t === id) out.push([rev[k], n.id]);
  for (const [xid, x] of Object.entries(XNODES)) for (const [k, t] of x.rel) if (t === `${graphKey}#${id}`) out.push([rev[k], xid]);
  return out;
}

/* ===================== render: dependencies (gantt-like) ===================== */
function deps(q) {
  const lanes = ['g-graph', 'g-rich', 'g-plat', 'g-web', 'x'];
  const laneName = { 'g-graph': 'Graph layer', 'g-rich': 'Rich content', 'g-plat': 'Platforms', 'g-web': 'Website & docs', x: 'Other graphs ↗' };
  const items = NODES.filter(n => n.rel.some(([k]) => k === 'part-of')).map(n => ({ id: n.id, n, lane: n.rel.find(([k]) => k === 'part-of')[1] }));
  items.push({ id: 'web#feat', x: XNODES['web#feat'], lane: 'x' }, { id: 'docs#guide', x: XNODES['docs#guide'], lane: 'x' });
  const lvl = {};
  const level = id => {
    if (lvl[id] != null) return lvl[id];
    const it = items.find(i => i.id === id); if (!it) return 0;
    const rels = it.n ? it.n.rel : it.x.rel;
    let L = 0;
    for (const [k, t] of rels) if (k === 'depends-on') { const tt = t.replace('roadmap#', ''); L = Math.max(L, level(tt) + 1); }
    if (id === 'docs#guide') L = level('ndocs');
    return lvl[id] = L;
  };
  items.forEach(i => level(i.id));
  const COL0 = 120, DECW = 170, COLW = 200, BARW = 178, ROWH = 46, LANEPAD = 26;
  const maxL = Math.max(...Object.values(lvl));
  const pos = {}; const decisions = [];
  let y = 26;
  const laneTops = [];
  for (const ln of lanes) {
    const its = items.filter(i => i.lane === ln);
    const slots = {};
    let rows = 1;
    for (const it of its) {
      const L = lvl[it.id]; slots[L] = (slots[L] ?? 0);
      pos[it.id] = { x: COL0 + DECW + L * COLW, y: y + LANEPAD + slots[L] * ROWH };
      slots[L]++; rows = Math.max(rows, slots[L]);
      if (it.n) for (const [k, t] of it.n.rel) if (k === 'blocked-by' && t.startsWith('text:')) {
        const open = !(t.includes('Windows') && M.answered.q2);
        if (open) decisions.push({ to: it.id, text: t.slice(5), x: COL0, y: pos[it.id].y + 4, lt: y });
      }
    }
    laneTops.push([ln, y, rows * ROWH + LANEPAD + 8]);
    y += rows * ROWH + LANEPAD + 8;
  }
  const W = COL0 + DECW + (maxL + 1) * COLW + 20, H = y + 10;
  const edges = [];
  for (const it of items) {
    const rels = it.n ? it.n.rel : it.x.rel;
    for (const [k, t0] of rels) {
      const t = t0.replace('roadmap#', '');
      if (!pos[t] || (k !== 'depends-on' && k !== 'relates-to')) continue;
      if (k === 'relates-to' && !isX(t)) continue;
      const a = pos[t], b = pos[it.id];
      const tn = byId(t); const open = tn && stateOf(tn) !== 'done';
      let x1 = a.x + BARW, y1 = a.y + 17, x2 = b.x, y2 = b.y + 17;
      if (x2 <= x1) { x1 = a.x + BARW / 2; y1 = a.y + 34; x2 = b.x + BARW / 2; y2 = b.y; edges.push(`<path d="M${x1},${y1} C${x1},${y1 + 20} ${x2},${y2 - 20} ${x2},${y2}" class="e ${k === 'relates-to' ? 'rel' : open ? 'open' : 'ok'}" marker-end="url(#${k === 'relates-to' ? 'm-rel' : open ? 'm-open' : 'm-ok'})"/>`); continue; }
      const mx = (x1 + x2) / 2;
      edges.push(`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 2},${y2}" class="e ${k === 'relates-to' ? 'rel' : open ? 'open' : 'ok'}" marker-end="url(#${k === 'relates-to' ? 'm-rel' : open ? 'm-open' : 'm-ok'})"/>`);
    }
  }
  for (const d of decisions) { const b = pos[d.to], ly = d.lt + 12; edges.push(`<path d="M${d.x + 6},${d.y} V${ly} H${b.x - 12} V${b.y + 17} H${b.x - 2}" class="e blk" marker-end="url(#m-open)"/>`); }
  let h = `<div class="pad"><div class="legend">
    <span><svg width="34" height="8"><path d="M0,4 H28" class="e open" marker-end="url(#m-open)"/></svg> depends-on, target not done</span>
    <span><svg width="34" height="8"><path d="M0,4 H28" class="e ok" marker-end="url(#m-ok)"/></svg> depends-on, done</span>
    <span><svg width="34" height="8"><path d="M0,4 H28" class="e blk"/></svg> blocked-by (open decision)</span>
    <span><svg width="34" height="8"><path d="M0,4 H28" class="e rel"/></svg> relates-to (other graph)</span>
    <span>Columns are dependency steps, not dates.</span></div>
    <div class="deps" style="width:${W}px;height:${H}px">
    <svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;pointer-events:none">
      <defs>
        <marker id="m-open" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--destructive)"/></marker>
        <marker id="m-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted-foreground)"/></marker>
        <marker id="m-rel" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--sky)"/></marker>
      </defs>
      ${edges.join('')}
    </svg>`;
  h += `<div class="colh" style="left:${COL0}px">Open decisions</div>`;
  for (let L = 0; L <= maxL; L++) h += `<div class="colh" style="left:${COL0 + DECW + L * COLW}px">Step ${L + 1}</div>`;
  for (const [ln, top, hh] of laneTops) h += `<div class="lane" style="top:${top}px;height:${hh}px"><div class="ln">${laneName[ln]}${ln !== 'x' ? `<div class="progt" style="font-weight:400">${progress(ln).join('/')} done</div>` : ''}</div></div>`;
  for (const d of decisions) h += `<div class="dia" style="left:${d.x}px;top:${d.y}px"><i></i><span>${esc(d.text.replace('decision: ', ''))}</span></div>`;
  for (const it of items) {
    const p = pos[it.id];
    if (it.x) {
      h += `<div class="bar ghost ${it.x.state}" data-node="${it.id}" style="left:${p.x}px;top:${p.y}px;width:${BARW}px"><span class="bt">${esc(it.x.title)}</span><span class="bm"><span class="xg">↗ ${GRAPHS[it.x.graph].project}</span>${it.id === 'web#feat' ? '<span class="spin" style="width:6px;height:6px"></span>active' : ''}</span></div>`;
      continue;
    }
    const n = it.n, s = stateOf(n), b = openBlockers(n).length;
    h += `<div class="bar ${s} ${q.node === n.id ? 'sel' : ''}" data-node="${n.id}" style="left:${p.x}px;top:${p.y}px;width:${BARW}px">
      <span class="bt">${esc(n.title)}</span><span class="bm">${s}${refChip(n)}${isActive(n.id) ? '<span class="spin" style="width:6px;height:6px"></span>active' : ''}${b ? `<span style="color:var(--destructive);display:inline-flex;gap:2px;align-items:center">${I('ban', 'i12" style="width:10px;height:10px')}blocked</span>` : ''}</span></div>`;
  }
  return h + '</div></div>';
}

      <div class="seg">${['proposed', 'committed', 'done', 'dropped'].map(st => `<button class="${s === st ? 'on' : ''}" ${canSet(st) || s === st ? '' : 'disabled'} data-setstate="${st}">${stateGlyph(st)}${st}</button>`).join('')}</div>

    <div class="sec"><h4>Properties <span class="r">key / value, strings</span></h4><div class="kv">${Object.entries(n.props).map(([k, v]) => `<span class="k">${esc(k)}</span><span>${esc(v)}</span>`).join('') || '<span class="k">none</span><span></span>'}</div>${perm !== 'read' ? `<button class="add">${I('plus', 'i12')}Add property</button>` : ''}</div>
    <div class="sec"><h4>Relations</h4><div class="sub">Stored on this node</div>${out || '<div class="note">None.</div>'}${perm !== 'read' ? `<button class="add">${I('plus', 'i12')}Add relation (depends-on, blocked-by, part-of, relates-to)</button>` : ''}

  h += `<div class="note" style="margin-top:10px">Changes from other machines (mb16) show in git history, not here: the log is per machine.</div>`;
  return h + '</div></div></div>';
}

}
function dlgStart() {
  const a = AGENTS[M.startAgent];
  const order = ['read', 'write', 'manage'];
  const max = order.indexOf(a.perm);
  return `<div class="scrim"><div class="dlg" style="width:560px"><h3>Start session from agent</h3><div class="dsub">A normal session: it shows in the schedule (#77) and in the sidebar like any other.</div>
    <div class="field"><label>Agent</label><div class="opts">${Object.entries(AGENTS).map(([id, x]) => `<div class="opt ${M.startAgent === id ? 'on' : ''}" data-agent="${id}"><span class="rad"></span><span class="ot"><b>${x.name} <span class="perm ${x.perm}" style="margin-left:4px">${x.perm}</span></b><span>${x.model}</span></span></div>`).join('')}</div></div>
    <div class="field"><label>Where</label><div style="display:flex;gap:6px"><select><option>splitkick</option><option>splitkick-website</option><option>splitkick-docs</option></select>
      <select><option ${M.startWhere === 'base' ? 'selected' : ''}>base checkout</option><option>new worktree</option></select></div></div>
    <div class="field"><label>Serves</label><select><option>Splitkick roadmap (whole graph)</option><option>Graph support v1</option><option>Session network view</option></select>
      <div class="hint">Written as <code>serves</code> in the session’s metadata. The graph never lists sessions.</div></div>
    <div class="field"><label>Graph permission for this session</label><div style="display:flex;gap:4px">${order.map((p, i) => `<div class="opt ${M.startPerm === p ? 'on' : ''} ${i > max ? 'dis' : ''}" data-perm="${i > max ? '' : p}" style="flex:1"><span class="rad"></span><span class="ot"><b>${p}</b></span></div>`).join('')}</div>
      <div class="hint">The profile allows up to <b>${a.perm}</b>. You can lower it for one session, not raise it.</div></div>
    <div class="field"><label>Persona prompt <span class="note" style="font-weight:400">added to the system prompt</span></label><textarea rows="4" style="font-size:11px">${esc(a.persona)}</textarea></div>
    <div class="field"><label>First message</label><textarea rows="2">Review the roadmap against the last week’s merged PRs. Send me requests for anything that looks done.</textarea></div>
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="close">${I('play', 'i12')}Start session</button></div></div></div>`;
}

/* ===================== main render ===================== */
function render() {
  const q = getQ();
  document.documentElement.classList.toggle('dark', q.theme === 'dark');
  const cur = SCREENS.find(([, , p]) => Object.entries(p).every(([k, v]) => (q[k] ?? '') === v))?.[0] ?? '';
  let bar = SCREENS.map(([k, l]) => `<button class="${cur === k ? 'on' : ''}" data-screen="${k}">${l}</button>`).join('');
  bar += `<span class="sep"></span><button data-theme>${q.theme === 'dark' ? '☀ Light' : '☾ Dark'}</button>`;
  if (q.s === 'problem') {
    bar += `<span class="sep"></span>${OPTS.map(([k, l]) => `<button class="${q.opt === k ? 'on' : ''}" data-opt="${k}">${l}</button>`).join('')}
      <span class="sep"></span><button class="${q.fail !== '1' ? 'on' : ''}" data-fail="0">Normal</button><button class="${q.fail === '1' ? 'on' : ''}" data-fail="1">Failure case</button>`;
  }
  document.getElementById('mkbar').innerHTML = bar;
  document.getElementById('cap').innerHTML = CAPS[cur] ?? CAPS[q.s] ?? '';

  let main = '';
  if (q.s === 'agents') main = agents();
  else {
    main = graphHead(q);
    if (q.s === 'problem') main += problemBanner(q);
    const content = q.s === 'deps' ? deps(q) : q.s === 'review' ? review() : outline(q);
    main += `<div class="body"><div class="scroll">${content}${q.s === 'problem' ? `<div class="pad" style="padding-top:0">${problemTable(q)}</div>` : ''}</div>${q.node ? detail(q) : ''}</div>`;
  }
  const crumbs = q.s === 'agents' ? `<b>Agents</b>` : `<span>Graphs</span>${I('chevr', 'i12')}<b>Splitkick roadmap</b>`;
  document.getElementById('win').innerHTML = `
    <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><div class="crumbs">${crumbs}</div>
      <div class="right"><span class="row" data-go="agents" style="height:24px;padding:0 6px;border-radius:6px;gap:4px;font-size:12px">${I('bot')}Agents</span>
      <span class="bell" data-go="review" style="cursor:pointer" title="Requests for you">${I('bell', 'i16')}${pendingRequests() ? `<span class="n">${pendingRequests()}</span>` : ''}</span></div></div>
    <nav class="sidebar">${sidebar(q)}</nav>
    <main class="main">${main}${q.dlg === 'new' ? dlgNew() : q.dlg === 'start' ? dlgStart() : ''}</main>`;
}

/* ===================== events ===================== */
const GO = { outline: { s: 'outline', node: '', dlg: '' }, deps: { s: 'deps', dlg: '' }, review: { s: 'review', node: '', dlg: '' }, agents: { s: 'agents', node: '', dlg: '' }, problem: { s: 'problem', node: '', dlg: '' }, start: { dlg: 'start' } };
document.addEventListener('click', e => {
  const t = e.target.closest('[data-screen],[data-theme],[data-opt],[data-fail],[data-go],[data-node],[data-act],[data-setstate],[data-ans],[data-seen],[data-revert],[data-type],[data-loc],[data-agent],[data-perm],[data-start]');
  if (!t) { if (e.target.classList?.contains('scrim')) setQ({ dlg: '' }); return; }
  const d = t.dataset, q = getQ();
  if (d.screen) return setQ(SCREENS.find(s => s[0] === d.screen)[2]);
  if ('theme' in d) return setQ({ theme: q.theme === 'dark' ? 'light' : 'dark' });
  if (d.opt) return setQ({ opt: d.opt });
  if (d.fail) return setQ({ fail: d.fail });
  if (d.go) return GO[d.go] && setQ(GO[d.go]);
  if (d.setstate) { const n = byId(q.node); if (n) { M.stateOverride[n.id] = d.setstate; render(); } return; }
  if (d.ans) { M.answered[d.ans] = d.v; render(); return; }
  if (d.seen) { d.seen.split(',').forEach(id => M.seen.add(id)); render(); return; }
  if (d.revert) { M.reverted.add(d.revert); render(); return; }
  if (d.type) { M.newType = d.type; render(); return; }
  if (d.loc) { M.newLoc = d.loc; render(); return; }
  if (d.agent) { M.startAgent = d.agent; M.startPerm = AGENTS[d.agent].perm; render(); return; }
  if (d.perm) { M.startPerm = d.perm; render(); return; }
  if (d.start) { M.startAgent = d.start; M.startPerm = AGENTS[d.start].perm; return setQ({ dlg: 'start' }); }
  if (d.act === 'new') return setQ({ dlg: 'new' });
  if (d.act === 'close') return setQ({ dlg: '', ...(t.closest('.detail') ? { node: '' } : {}) });
  if (d.act === 'seenall') { CHANGES.forEach(c => M.seen.add(c.id)); render(); return; }
  if (d.node) return setQ({ node: d.node, s: q.s === 'review' || q.s === 'problem' ? 'outline' : q.s });
});
document.addEventListener('change', e => { if (e.target.dataset.act === 'viewas') { M.viewAs = e.target.value; render(); } });
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
