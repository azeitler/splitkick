[package]
name = "jean"
version = "0.1.73"
description = "Jean - AI Assistant"
authors = ["Andras Bacsai"]
edition = "2021"
default-run = "jean"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jean-core = { path = "../jean-core" }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "unstable", "webview-data-url"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-process = "2"
log = "0.4"
base64 = "0.22"
dirs = "5.0"
once_cell = "1.20"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_os = "macos")'.dependencies]
# kill(2) for a hung WebKit content process (src/webview_watchdog.rs).
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSColor", "NSResponder", "NSApplication", "NSMenu", "NSMenuItem", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
# Pause media in the in-app browser when its pane closes. Versions match wry's.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "block2"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Intercept OS file drops at the GTK widget level so WebKitGTK does not navigate
# the webview to the dropped file (which locks the window — DOM preventDefault
# cannot stop it). Versions pinned to Tauri's transitive deps.
webkit2gtk = "=2.0.2"
gtk = "=0.18.2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.2"
# Match Tauri/wry's WebView2 bindings for ProcessFailed recovery (issue #575).
# Bump together with Tauri: a different version breaks the Windows build.
webview2-com = "0.39"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

# Optimize for smaller binary size in release builds
[profile.release]
codegen-units = 1        # Better LLVM optimization (slower build, smaller binary)
lto = true               # Link-time optimizations
opt-level = "s"          # Optimize for size over speed
# Not "abort": wry catches the Objective-C exceptions WebKit throws (e.g. a
# reply to a URL scheme task WebKit already stopped when its content process
# died) with objc2::exception::catch, which cannot catch under panic=abort —
# the exception aborted the app instead (issue #110).
panic = "unwind"
strip = "debuginfo"      # Keep symbol names so crash reports are readable (#110)

# Fast local release profile — for testing release builds without distribution-grade size optimization.
# Use via: bun run tauri:build:fast
[profile.release-fast]
inherits = "release"
codegen-units = 16       # Parallel codegen (was 1)
lto = "thin"             # Thin LTO (was fat) — much faster link
opt-level = 2            # Speed-tuned, drops size-optimizer passes
strip = "debuginfo"      # Keep symbols for crash reports, drop debuginfo
incremental = true       # Reuse compilation across local rebuilds

[dev-dependencies]
tempfile = "3.23.0"
